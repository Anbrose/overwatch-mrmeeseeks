<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一起看</title>
  <link rel="stylesheet" href="/static/player.css">
</head>
<body>
  <main class="page">
    <section id="stage-wrap" class="stage-wrap">
      <div id="stage" class="stage">
        <div id="player-host" class="player-host"></div>
        <div id="shield" class="shield" aria-hidden="true"></div>
        <div id="stage-msg" class="stage-msg">连接中…</div>

        <button id="big-play" class="big-play glass pop chrome" type="button" hidden aria-label="播放">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <div id="status" class="status glass chrome offline">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="conn" class="conn" hidden>连接中…</span>
          <span id="live-badge" class="live-badge" hidden>直播</span>
          <span class="room">房间 <b id="room-code"></b></span>
        </div>

        <div class="alerts">
          <button id="sync-btn" class="pill glass pop sync-btn" type="button" hidden>落后了 · 同步</button>
          <button id="stall-btn" class="pill glass pop stall-btn" type="button" hidden>网络卡顿？报告给房主</button>
        </div>

        <div id="toast" class="toast glass-card pop" role="status" aria-live="polite" hidden></div>

        <button id="start" class="start pop" type="button" hidden disabled>加载中…</button>
      </div>

      <div class="topbar chrome">
        <button id="ep-btn" class="gbtn glass" type="button" hidden aria-expanded="false" aria-controls="ep-panel">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
          <span id="ep-btn-label">选集</span>
        </button>
        <button id="perm-btn" class="gbtn glass" type="button" hidden aria-expanded="false" aria-controls="perm-panel">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM10.8 12.2L20 3M17 6l3 3M14 9l2 2"/></svg>
          <span>权限</span>
        </button>
        <button id="bs-btn" class="gbtn glass" type="button" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3zM8 21h8M12 17v4"/></svg>
          <span>在电视上看</span>
        </button>
      </div>

      <aside id="ep-panel" class="panel glass-card pop" hidden>
        <div id="vod-panel" class="vod-panel" hidden>
          <div class="panel-head">选集</div>
          <div id="episodes" class="episodes"></div>
          <div class="line-row">
            <span id="line-label" class="line-label"></span>
            <button id="next-line" class="line-btn" type="button">换一个片源</button>
          </div>
        </div>
        <div id="tv-panel" class="vod-panel" hidden>
          <div class="panel-head">直播源</div>
          <div class="line-row">
            <span id="tv-line-label" class="line-label"></span>
            <button id="tv-next" class="line-btn" type="button">换一个源</button>
          </div>
        </div>
      </aside>

      <aside id="perm-panel" class="panel glass-card pop" hidden>
        <div class="panel-head">谁能控制播放</div>
        <ul id="members" class="members"></ul>
        <form id="change-form" class="change-form">
          <label for="change-url">换一个视频</label>
          <div class="change-row">
            <input id="change-url" class="change-url" type="text" inputmode="url" placeholder="粘贴链接" autocomplete="off">
            <button class="change-btn" type="submit">换视频</button>
          </div>
          <span class="change-hint">支持 B 站或 YouTube 链接，可直接粘贴分享文字</span>
        </form>
      </aside>

      <div id="resume" class="resume glass pop" hidden></div>

      <div class="dock glass-card chrome">
        <div class="dock-info">
          <span id="title" class="title">一起看</span>
          <span id="time" class="time">0:00 / 0:00</span>
        </div>
        <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="进度">
        <div class="dock-controls">
          <div class="dock-group">
            <button id="play" class="ctl play swap" type="button" disabled aria-label="播放">
              <svg class="i-a" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg class="i-b" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
            </button>
            <button id="mute" class="ctl swap" type="button" aria-label="静音">
              <svg class="i-a" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
              <svg class="i-b" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9.5l5 5M22 9.5l-5 5"/></svg>
            </button>
            <input id="volume" class="volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量">
          </div>
          <div class="dock-group">
            <button id="cast" class="ctl" type="button" hidden aria-label="投屏" title="投屏">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-6M3 12a7 7 0 0 1 7 7M3 16a3 3 0 0 1 3 3M3 19.5h.01"/></svg>
            </button>
            <button id="fs" class="ctl" type="button" aria-label="全屏">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="under">
      <div id="people" class="people" aria-label="房间里的人"></div>
      <div id="me" class="me"></div>
    </div>
  </main>

  <div id="bs-panel" class="bs-panel" role="dialog" aria-modal="true" aria-labelledby="bs-title" hidden>
    <div class="bs-card glass-card">
      <div class="bs-head">
        <span id="bs-title" class="bs-title">在电视上看</span>
        <button id="bs-close" class="ctl" type="button" aria-label="关闭">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="qr" class="qr" aria-label="房间二维码"></div>
      <p class="bs-hint">电视或盒子的浏览器打开 <b id="bs-host"></b>，输入房间号</p>
      <div id="bs-code" class="bs-code"></div>
      <p class="bs-hint small">手机扫码也能进。电视进来是普通观众，播放照样在这里控制。</p>
    </div>
  </div>

  <script src="/static/cast.js"></script>
  <script src="/static/player.js"></script>
</body>
</html>
