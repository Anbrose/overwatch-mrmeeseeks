# 密钥放在同目录的 .env（不是 server/.env），格式见 server/.env.example。
services:
  mrmeeseeks:
    build: .
    image: mrmeeseeks:local
    restart: unless-stopped
    env_file: .env
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: "8765"
      STATE_DIR: /state
    volumes:
      # 标注的模板和待标注队列，重新部署也保留；容器用户 uid 10001 需要可写
      - ./state:/state
      # 英雄问答的 Wiki 数据缓存（不能挂到 /app/data，那里是镜像自带的模板、地图表）
      - herodata:/app/herodata
    ports:
      - "8765:8765"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g

volumes:
  herodata:
